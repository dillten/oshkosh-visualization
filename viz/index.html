<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirVenture 2026 — ADS-B Timelapse</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">
      <div id="title-block">
        <h1>EAA AirVenture Oshkosh 2026</h1>
        <div id="clock">—</div>
        <div id="counts">loading…</div>
      </div>
      <div id="legend"></div>
      <label id="radar-credit" hidden>Radar: NOAA NEXRAD via IEM Mesonet</label>
    </div>
    <div id="tour-card" hidden>
      <div id="tour-progress"></div>
      <div id="tour-title"></div>
      <div id="tour-caption"></div>
      <div id="tour-buttons">
        <button id="tour-prev" title="Previous">‹</button>
        <button id="tour-stop">Stop tour</button>
        <button id="tour-next" title="Next">›</button>
      </div>
    </div>
    <div id="controls">
      <button id="play" title="Play/pause (space)">⏸</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1" />
      <select id="speed" title="Playback speed">
        <option value="300">300×</option>
        <option value="900">900×</option>
        <option value="1800" selected>1800×</option>
        <option value="3600">3600×</option>
        <option value="7200">7200×</option>
      </select>
      <select id="colorby" title="Color by">
        <option value="dir" selected>Direction</option>
        <option value="region">Origin region</option>
      </select>
      <label id="radar-label" title="Overlay historical NEXRAD weather radar">
        <input type="checkbox" id="radar-toggle" /> Radar
      </label>
      <label id="night-label" title="Shade the night hemisphere">
        <input type="checkbox" id="night-toggle" /> Night
      </label>
      <button id="tour-toggle" title="Guided tour of notable aircraft">Tour</button>
      <button id="link-toggle" title="Copy a link to this view">Link</button>
      <button id="explore-toggle" title="Explore">Explore</button>
    </div>
    <aside id="explore-panel" hidden>
      <div id="explore-head">
        <div id="explore-tabs">
          <button class="tab-btn active" data-tab="overview">Overview</button>
          <button class="tab-btn" data-tab="aircraft">Aircraft</button>
          <button class="tab-btn" data-tab="airport">Airport</button>
          <button class="tab-btn" data-tab="type">Type</button>
        </div>
        <button id="explore-close" title="Close">✕</button>
      </div>
      <div id="selection-bar" hidden>
        <span id="selection-label"></span>
        <label id="tilt-label" hidden title="Tilt the map and show altitude in 3D">
          <input type="checkbox" id="tilt-toggle" /> 3D
        </label>
        <button id="selection-clear">Clear</button>
      </div>
      <div id="explore-body">loading…</div>
    </aside>
    <div id="toast" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
